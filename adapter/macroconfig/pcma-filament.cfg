# PCMA manual filament workflow for a fresh, single-extruder Klipper.
# Filament routines do not move XYZ or home; no existing filament macros needed.
# Explicit RESUME delegates to Klipper and can return to the saved print position.
# Tune the PCMA_STATE temperatures, distances and speed for your own extruder.
# Existing save_variables / custom RESUME sections need an explicit merge;
# do not include this full fresh-printer bundle over conflicting definitions.
[save_variables]
filename: ~/pcma-variables.cfg

[pause_resume]

[gcode_macro PCMA_STATE]
description: PCMA status; no physical action
variable_contract_version: 0
variable_filament_contract_version: 1
variable_phase: 'IDLE'
variable_execution_id: ''
variable_loaded_material: 'UNKNOWN'
variable_loaded_color: 'UNKNOWN'
variable_change_id: ''
variable_last_request_id: ''
variable_confirmed_change_id: ''
variable_filament_phase: 'RECOVERY_REQUIRED'
variable_target_material: 'UNKNOWN'
variable_target_color: 'UNKNOWN'
variable_boot_ready: False
variable_temperatures: {'PLA': 210, 'PETG': 235, 'ABS': 240, 'ASA': 245, 'TPU': 220, 'WOOD': 205, 'PCTG': 245}
variable_load_length: 40.0
variable_unload_length: 40.0
variable_purge_length: 5.0
variable_extrude_speed: 2.0
variable_unload_temperature: 220.0
gcode:
    {action_respond_info("PCMA: " ~ printer['gcode_macro PCMA_STATE'].filament_phase)}

[delayed_gcode _PCMA_BOOT]
initial_duration: 1
gcode:
    # Never heat, move, resume or restore a physical claim after a restart.
    {% set saved = printer.save_variables.variables.get('pcma_filament', {}) %}
    {% set last = saved.get('last_request', saved.get('request', '')) %}
    {% set safe = namespace(valid=last is string and last|length <= 64) %}
    {% if last is string %}
        {% for char in last %}
            {% if char not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-' %}
                {% set safe.valid = False %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if safe.valid %}
        SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=last_request_id VALUE='"{last}"'
    {% else %}
        {action_raise_error("Invalid PCMA persistent record; inspect the variables file locally")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=boot_ready VALUE=True
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=filament_phase VALUE='"RECOVERY_REQUIRED"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=loaded_material VALUE='"UNKNOWN"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=loaded_color VALUE='"UNKNOWN"'
    M117 PCMA: Zustand pruefen

[gcode_macro _PCMA_GUARD]
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if not s.boot_ready %}
        {action_raise_error("PCMA is still initializing")}
    {% endif %}
    {% set state = printer.print_stats.state if 'print_stats' in printer else 'standby' %}
    {% if state not in ['standby', 'complete', 'cancelled', 'paused'] %}
        {action_raise_error("PCMA requires an idle or paused printer")}
    {% endif %}
    {% if state == 'paused' and not printer.pause_resume.is_paused %}
        {action_raise_error("PCMA pause state is inconsistent")}
    {% endif %}
    {% if not printer.pause_resume.is_paused and printer.idle_timeout.state not in ['Idle', 'Ready'] %}
        {action_raise_error("Printer is processing another action")}
    {% endif %}

[gcode_macro _PCMA_STORE]
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% set phase = params.PHASE|default(s.filament_phase) %}
    {% set request = params.REQUEST|default(s.change_id) %}
    {% set material = params.MATERIAL|default(s.target_material) %}
    {% set color = params.COLOR|default(s.target_color) %}
    {% set confirmed = phase == 'CONFIRMED' %}
    # One persistent record is written before publishing the new runtime state.
    {% set last = request if request else s.last_request_id %}
    {% set record = {'version': 1, 'phase': phase, 'request': request, 'last_request': last, 'material': material, 'color': color} %}
    SAVE_VARIABLE VARIABLE=pcma_filament VALUE="{record}"
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=filament_phase VALUE='"{phase}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=change_id VALUE='"{request}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=last_request_id VALUE='"{last}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=target_material VALUE='"{material}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=target_color VALUE='"{color}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=loaded_material VALUE='"{material if confirmed else 'UNKNOWN'}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=loaded_color VALUE='"{color if confirmed else 'UNKNOWN'}"'
    SET_GCODE_VARIABLE MACRO=PCMA_STATE VARIABLE=confirmed_change_id VALUE='"{request if confirmed else ''}"'

[gcode_macro _PCMA_REQUEST]
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% set request = params.REQUEST|default('local-' ~ (printer.toolhead.estimated_print_time|int)) %}
    {% set material = params.MATERIAL|default('')|upper %}
    {% set color = params.COLOR|default('')|upper %}
    {% set safe = namespace(valid=True) %}
    {% for char in request %}
        {% if char not in 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-' %}
            {% set safe.valid = False %}
        {% endif %}
    {% endfor %}
    {% if not safe.valid or request|length < 1 or request|length > 64 %}
        {action_raise_error("Invalid PCMA request ID")}
    {% endif %}
    {% if material not in s.temperatures %}
        {action_raise_error("Material has no approved PCMA temperature: " ~ material)}
    {% endif %}
    {% if color|length != 8 or color[:2] != 'C_' %}
        {action_raise_error("PCMA color must be C_RRGGBB")}
    {% endif %}
    {% for char in color[2:] %}
        {% if char not in '0123456789ABCDEF' %}
            {action_raise_error("Invalid PCMA RGB color")}
        {% endif %}
    {% endfor %}
    {% set temperature = s.temperatures[material]|float %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% if temperature != temperature or temperature < cfg.get('min_extrude_temp', 170) or temperature > cfg.max_temp - 5 %}
        {action_raise_error("Material temperature is outside this extruder's configured limits")}
    {% endif %}
    {% if request == s.last_request_id %}
        {action_respond_info("PCMA request already known; no physical repeat")}
    {% elif s.filament_phase not in ['IDLE', 'CONFIRMED', 'UNLOADED'] %}
        {action_raise_error("Complete or locally reset the current PCMA workflow first")}
    {% else %}
        _PCMA_GUARD
        _PCMA_STORE PHASE=REQUESTED REQUEST={request} MATERIAL={material} COLOR={color}
        {% if params.MODE|default('CHANGE') == 'CHANGE' %}
            {% if s.filament_phase == 'UNLOADED' %}
                _PCMA_STORE PHASE=AWAITING_INSERTION
                M117 PCMA: Filament einfuehren
            {% else %}
                _PCMA_CHANGE_UNLOAD TEMP={s.temperatures.get(s.loaded_material, s.unload_temperature)}
            {% endif %}
        {% else %}
            _PCMA_STORE PHASE=AWAITING_INSERTION
            PCMA_LOCAL_LOAD
        {% endif %}
    {% endif %}

[gcode_macro PCMA_FILAMENT_CHANGE]
description: Start one correlated change; unload, then insert filament locally
gcode:
    _PCMA_REQUEST {rawparams} MODE=CHANGE

[gcode_macro PCMA_LOAD_FILAMENT]
description: Load with requested material and color; requires local confirmation
gcode:
    _PCMA_REQUEST {rawparams} MODE=LOAD

[gcode_macro _PCMA_CHANGE_UNLOAD]
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if s.filament_phase != 'REQUESTED' %}
        {action_raise_error("No pending PCMA request to unload")}
    {% endif %}
    _PCMA_GUARD
    _PCMA_STORE PHASE=UNLOADING
    _PCMA_EXTRUDE MODE=UNLOAD TEMP={params.TEMP|default(s.unload_temperature)|float}
    _PCMA_STORE PHASE=AWAITING_INSERTION
    M117 PCMA: Filament einfuehren

[gcode_macro PCMA_LOCAL_LOAD]
description: After inserting filament, load once using configured PCMA distance
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if s.filament_phase != 'AWAITING_INSERTION' or s.target_material not in s.temperatures %}
        {action_raise_error("No PCMA load awaiting local insertion")}
    {% endif %}
    _PCMA_GUARD
    _PCMA_STORE PHASE=LOADING
    _PCMA_EXTRUDE MODE=LOAD
    _PCMA_STORE PHASE=AWAITING_CONFIRMATION
    M117 PCMA: Farbe pruefen

[gcode_macro PCMA_PURGE_FILAMENT]
description: Locally purge another 5 mm before confirming color
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if s.filament_phase != 'AWAITING_CONFIRMATION' %}
        {action_raise_error("PCMA purge requires loaded filament awaiting confirmation")}
    {% endif %}
    _PCMA_GUARD
    _PCMA_EXTRUDE MODE=PURGE

[gcode_macro PCMA_CONFIRM_FILAMENT]
description: Local confirmation that material and RGB color match the requested spool
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if s.filament_phase != 'AWAITING_CONFIRMATION' or not s.change_id %}
        {action_raise_error("PCMA has no loaded request awaiting confirmation")}
    {% endif %}
    _PCMA_GUARD
    _PCMA_STORE PHASE=CONFIRMED
    M117 PCMA: Farbe bestaetigt
    # Deliberately no RESUME here.

[gcode_macro PCMA_UNLOAD_FILAMENT]
description: Unload outside an active change and invalidate the material claim
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if s.filament_phase not in ['IDLE', 'CONFIRMED'] %}
        {action_raise_error("Finish or locally reset the PCMA change before a separate unload")}
    {% endif %}
    {% set temperature = params.TEMP|default(s.temperatures.get(s.loaded_material, s.unload_temperature))|float %}
    {% if temperature < 180 or temperature > printer.configfile.settings.extruder.max_temp - 5 %}
        {action_raise_error("PCMA unload temperature is outside the approved range")}
    {% endif %}
    _PCMA_GUARD
    _PCMA_STORE PHASE=UNLOADING REQUEST= MATERIAL=UNKNOWN COLOR=UNKNOWN
    _PCMA_EXTRUDE MODE=UNLOAD TEMP={temperature}
    _PCMA_STORE PHASE=UNLOADED REQUEST= MATERIAL=UNKNOWN COLOR=UNKNOWN

[gcode_macro PCMA_RESET_FILAMENT]
description: After a local physical check, discard an interrupted claim; never resume
gcode:
    _PCMA_GUARD
    _PCMA_STORE PHASE=IDLE REQUEST= MATERIAL=UNKNOWN COLOR=UNKNOWN
    M117 PCMA: Neuer Auftrag moeglich

[gcode_macro _PCMA_EXTRUDE]
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% set mode = params.MODE|default('') %}
    {% set distance = (s.unload_length if mode == 'UNLOAD' else s.purge_length if mode == 'PURGE' else s.load_length)|float %}
    {% set temperature = params.TEMP|default(s.temperatures.get(s.target_material, 220))|float %}
    {% set speed = s.extrude_speed|float %}
    {% set expected = 'UNLOADING' if mode == 'UNLOAD' else 'AWAITING_CONFIRMATION' if mode == 'PURGE' else 'LOADING' %}
    {% if mode not in ['LOAD', 'UNLOAD', 'PURGE'] or s.filament_phase != expected %}
        {action_raise_error("PCMA extrusion does not match the active workflow")}
    {% endif %}
    {% if distance != distance or distance <= 0 or distance > cfg.get('max_extrude_only_distance', 50) %}
        {action_raise_error("PCMA distance exceeds this extruder's extrusion-only limit")}
    {% endif %}
    {% if speed != speed or speed <= 0 or speed > 5 or speed > cfg.get('max_extrude_only_velocity', 5) %}
        {action_raise_error("PCMA speed exceeds the approved extrusion-only limit")}
    {% endif %}
    {% if temperature != temperature or temperature < cfg.get('min_extrude_temp', 170) or temperature > cfg.max_temp - 5 %}
        {action_raise_error("PCMA temperature is outside this extruder's configured limits")}
    {% endif %}
    _PCMA_GUARD
    SAVE_GCODE_STATE NAME=PCMA_FILAMENT
    M83
    M109 S{temperature}
    G1 E{ -distance if mode == 'UNLOAD' else distance } F{speed * 60}
    M400
    M104 S0
    RESTORE_GCODE_STATE NAME=PCMA_FILAMENT MOVE=0

[gcode_macro RESUME]
description: Explicit user resume, blocked while PCMA confirmation is pending
rename_existing: PCMA_RESUME_BASE
gcode:
    {% set s = printer['gcode_macro PCMA_STATE'] %}
    {% if not s.boot_ready or s.filament_phase not in ['IDLE', 'CONFIRMED'] %}
        {action_raise_error("Complete or locally reset the PCMA filament workflow before resume")}
    {% endif %}
    {% if s.filament_phase == 'CONFIRMED' and s.change_id != s.confirmed_change_id %}
        {action_raise_error("PCMA confirmation does not match this request")}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {% if s.filament_phase == 'CONFIRMED' %}
            M109 S{s.temperatures[s.loaded_material]}
        {% elif not printer.extruder.can_extrude %}
            {action_raise_error("Heat the extruder before explicitly resuming")}
        {% endif %}
        PCMA_RESUME_BASE {rawparams}
    {% endif %}
