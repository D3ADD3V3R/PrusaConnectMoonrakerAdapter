# Optional LCD menu; include only on a printer with a configured display.
[menu __main __pcma]
type: list
name: PCMA Filament

[menu __main __pcma __load]
type: command
name: Eingefuehrt: Laden
enable: {printer['gcode_macro PCMA_STATE'].filament_phase == 'AWAITING_INSERTION'}
gcode: PCMA_LOCAL_LOAD

[menu __main __pcma __purge]
type: command
name: Nachspuelen
enable: {printer['gcode_macro PCMA_STATE'].filament_phase == 'AWAITING_CONFIRMATION'}
gcode: PCMA_PURGE_FILAMENT

[menu __main __pcma __confirm]
type: command
name: Material/Farbe OK
enable: {printer['gcode_macro PCMA_STATE'].filament_phase == 'AWAITING_CONFIRMATION'}
gcode: PCMA_CONFIRM_FILAMENT

[menu __main __pcma __reset]
type: command
name: Geprueft: Zuruecksetzen
gcode: PCMA_RESET_FILAMENT
